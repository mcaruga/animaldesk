name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Dipendenze
        run: pip install ".[dev,foto]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: pip install ".[build,dev]" opencv-python-headless numpy anthropic
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Costruisci AnimalDesk.exe
        run: pyinstaller --noconfirm packaging/animaldesk.spec
      - name: Prova l'eseguibile
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnimalDesk.exe" -ArgumentList "--self-test" -Wait -PassThru
          $log = Join-Path $env:TEMP "animaldesk-selftest.log"
          if (Test-Path $log) { Get-Content $log }
          "{0:N1} MB" -f ((Get-Item "dist\AnimalDesk.exe").Length / 1MB)
          if ($p.ExitCode -ne 0) { throw "self-test fallito (codice $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalDesk-windows
          path: dist/AnimalDesk.exe
          if-no-files-found: error
      - name: Pubblica (ultima build)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/AnimalDesk.exe --prerelease --target "$GITHUB_SHA" \
            --title "AnimalDesk - ultima build" \
            --notes "Build automatica di main ($GITHUB_SHA). Scarica AnimalDesk.exe e avvialo: non serve installare nulla."
      - name: Pubblica (versione)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/AnimalDesk.exe --title "AnimalDesk $GITHUB_REF_NAME" --generate-notes
